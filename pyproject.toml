[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speakeronnx"
dynamic = ["version"]
description = "Pure-onnxruntime speaker embedding library — no torch at runtime"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "onnxruntime",
    "huggingface_hub",
]

[project.optional-dependencies]
soxr = ["soxr"]
test = [
    "pytest",
    "edge-tts",
]

[project.scripts]
speakeronnx = "speakeronnx.__main__:main"

[project.urls]
Homepage = "https://github.com/TigreGotico/speakeronnx"

[tool.setuptools.dynamic]
version = {attr = "speakeronnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"speakeronnx" = ["**/*"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_site_packages = true
strict = false
warn_unused_ignores = true
warn_return_any = false
